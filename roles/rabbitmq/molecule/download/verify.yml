---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true
  become: true
  pre_tasks:
    - name: Include env role from eclipse.slm collection
      ansible.builtin.include_role:
        name: eclipse.slm.env

    - name: "Render RabbitMQ docker compose template"
      ansible.builtin.set_fact:
        rabbitmq_compose: "{{ lookup('template', lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/templates/rabbitmq.yml', template_vars={'app_configs': _rabbitmq_placeholder_app_configs}) | from_yaml }}"
      vars:
        _rabbitmq_placeholder_app_configs:
          rabbitmq:
            users:
              admin:
                username: ""
                password: ""

  tasks:
    - name: "Extract images from docker compose"
      ansible.builtin.set_fact:
        rabbitmq_images: "{{ rabbitmq_compose.services | dict2items | map(attribute='value.image') | unique | list }}"

    - name: "Get image information"
      community.docker.docker_image_info:
        name: "{{ rabbitmq_images }}"
      register: rabbitmq_image_info

    - name: "Assert all images are downloaded"
      ansible.builtin.assert:
        that:
          - rabbitmq_missing_images | length == 0
        fail_msg: "Missing docker images: {{ rabbitmq_missing_images | join(', ') }}"
        success_msg: "All {{ rabbitmq_images | length }} docker images are downloaded."
      vars:
        rabbitmq_present_images: "{{ rabbitmq_image_info.images | map(attribute='RepoTags') | flatten }}"
        rabbitmq_missing_images: "{{ rabbitmq_images | reject('in', rabbitmq_present_images) | list }}"
