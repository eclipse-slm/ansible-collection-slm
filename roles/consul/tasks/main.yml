### Inputs
- name: "SLM | CONSUL | Assert inputs of 'consul/init | main.yml'"
  ansible.builtin.assert:
    that:
      - (consul.url.internal is defined) and (consul.url.internal|length > 0)                 # URL of the Consul instance to be configured
      - (_consul_token is defined) and (_consul_token|length > 0)           # Token to authenticate with Consul
      - (keycloak.url.internal is defined) and (keycloak.url.internal|length > 0)   # Auth URL of the Keycloak instance used for auth method

- name: "SLM | CONSUL | Wait for Keycloak ('{{ keycloak.url.internal }}') being up "
  ansible.builtin.uri:
    url: "{{ keycloak.url.internal }}/realms/fabos/.well-known/openid-configuration"
    validate_certs: false
    status_code: 200
  register: result
  until: result.status == 200
  retries: 120
  delay: 3

- name: "SLM | CONSUL | Create auth method for Keycloak"
  ansible.builtin.uri:
    url: "{{ consul.url.internal }}/v1/acl/auth-method"
    method: PUT
    headers:
      authorization: "Bearer {{ _consul_token }}"
    body_format: json
    body: "{{ consul_keyloak_auth_method }}"
    status_code: 200
  register: output_put_auth_method

- name: "SLM | CONSUL | Create Keycloak client for Consul-UI"
  ansible.builtin.include_role:
    name: eclipse-slm.keycloak_client
    tasks_from: clients/create_client.yml
  vars:
    _keycloak_client: "{{ consul_keycloak_client }}"
    _keycloak_access_token: "{{ keycloak_access_token }}"
    _keycloak_realm_name: "{{ ENV.KEYCLOAK.REALM }}"

- name: "SLM | CONSUL | Get secret of Keycloak client for Consul-UI"
  ansible.builtin.include_role:
    name: eclipse-slm.keycloak_client
    tasks_from: clients/get_client_secret.yml
  vars:
    _client_id: "{{ consul_keycloak_client.client_id }}"
    _keycloak_access_token: "{{ keycloak_access_token }}"
    _keycloak_realm_name: "{{ ENV.KEYCLOAK.REALM }}"

- name: "SLM | CONSUL | Register secret in Consul facts"
  ansible.builtin.set_fact:
    consul_keycloak_client: "{{ consul_keycloak_client | combine({'client_secret': client_secret}, recursive=true) }}"

- name: "SLM | CONSUL | Create token for SLM"
  block:
    - name: "SLM | CONSUL | Create SLM node"
      ansible.builtin.uri:
        url: "{{ consul.url.internal }}/v1/catalog/register"
        method: PUT
        headers:
          X-Consul-Token: "{{ _consul_token }}"
        body_format: json
        body:
          Node: "SLM"
          Address: "{{ ENV.SLM_HOSTNAME }}"
          NodeMeta:
            slm_hostname: "{{ ENV.SLM_HOSTNAME }}"
            slm_ip: "{{ ENV.SLM_IP }}"
            catalog_service_url: "{{ catalog_service.url.proxy }}"
            notification_service_url: "{{ notification_service.url.proxy }}"
            information_service_url: "{{ information_service.url.proxy }}"
            irs_url: "{{ irs.url.proxy }}"
            platform_management_url: "{{ platform_management.url.proxy }}"
            resource_management_url: "{{ resource_management.url.proxy }}"
            service_management_url: "{{ service_management.url.proxy }}"
            monitoring_service_url: "{{ monitoring_service.url.proxy }}"
            awx_url: "{{ awx.url.external }}"
            consul_url: "{{ consul.url.external }}"
            vault_url: "{{ vault.url.external }}"
            keycloak_url: "{{ keycloak.url.external_without_port }}"
            aas_aas_gui_url: "{{ aas.aas_gui.url.proxy }}"
            aas_aas_discovery_url: "{{ aas.aas_discovery.url.proxy }}"
            aas_aas_registry_url: "{{ aas.aas_registry.url.proxy }}"
            aas_aas_repository_url: "{{ aas.aas_repository.url.proxy }}"
            aas_submodel_registry_url: "{{ aas.submodel_registry.url.proxy }}"
            aas_submodel_repository_url: "{{ aas.submodel_repository.url.proxy }}"
            aas_concept_description_repository_url: "{{ aas.concept_description_repository.url.proxy }}"
            minio_api_url: "{{ minio.url.api.external }}"
            minio_console_url: "{{ minio.url.console.external }}"
        status_code: 200

    - name: "SLM | CONSUL | Create policy for SLM node to make it publicly available"
      community.general.consul_policy:
        scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
        host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
        port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
        token: "{{ _consul_token }}"
        name: anonymous-read
        rules: |
          node_prefix "SLM" {
            policy = "read"
          }

    - name: "SLM | CONSUL | Assign policy to anonymous token"
      community.general.consul_token:
        scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
        host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
        port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
        token: "{{ _consul_token }}"
        state: present
        accessor_id: 00000000-0000-0000-0000-000000000002
        policies:
          - name: "anonymous-read"


- name: "SLM | CONSUL | Create policy for consul-ui token"
  community.general.consul_policy:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ _consul_token }}"
    name: consul-ui-read
    rules: |
      node_prefix ""    { policy = "read" }
      service_prefix "" { policy = "read" }
      key_prefix ""     { policy = "read" }

- name: "SLM | CONSUL | Create token for consul-ui"
  community.general.consul_token:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ _consul_token }}"
    state: present
    description: "Token for consul-ui"
    policies:
      - name: "consul-ui-read"
  register: consul_ui_token_response

- name: "SLM | CONSUL | Register consul-oauth2-proxy"
  ansible.builtin.include_role:
    name: eclipse-slm.consul_client
    tasks_from: register_service
  vars:
    _service_name: "consul-oauth2-proxy"
    _service_port: 4180
    _service_address: "consul-oauth2-proxy"
    _additional_tags:
      - "consul-oauth2-proxy"
      - "exposed"
      - traefik.http.routers.oauth2.rule=Host(`consul.{{ ENV.SLM_HOSTNAME }}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2.entrypoints=websecure
      - traefik.http.routers.oauth2.tls=true
      - traefik.http.routers.oauth2.priority=100
      - traefik.http.routers.oauth2.service=consul-oauth2-proxy
      - traefik.http.middlewares.consul-oauth-errors.errors.status=401-403
      - traefik.http.middlewares.consul-oauth-errors.errors.service=consul-oauth2-proxy
      - traefik.http.middlewares.consul-oauth-errors.errors.query=/oauth2/sign_in?rd={url}
      - traefik.http.middlewares.consul-auth-readers.forwardauth.address=http://consul-oauth2-proxy:4180/oauth2/auth?allowed_groups=consul-readers
      - traefik.http.middlewares.consul-auth-readers.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.consul-auth-readers.forwardauth.authResponseHeaders=X-Auth-Request-Preferred-Username

- name: "SLM | CONSUL | Register consul-ui"
  ansible.builtin.include_role:
    name: eclipse-slm.consul_client
    tasks_from: register_service
  vars:
    _service_name: "consul-ui"
    _service_port: 8500
    _service_address: "consul"
    _additional_tags:
      - "consul"
      - "exposed"
      # TODO: Move to traefik file-based configuration in order to avoid token exposure in tags
      - traefik.http.middlewares.consul-token-reader.headers.customrequestheaders.X-Consul-Token={{ consul_ui_token_response.token.SecretID }}
      - traefik.http.routers.consul-reader.rule=Host(`consul.{{ ENV.SLM_HOSTNAME }}`)
      - traefik.http.routers.consul-reader.entrypoints=web,websecure
      - traefik.http.routers.consul-reader.tls=false
      - traefik.http.routers.consul-reader.service=consul-ui
      - traefik.http.routers.consul-reader.middlewares=consul-oauth-errors,consul-auth-readers,consul-token-reader

- name: "SLM | CONSUL | Restart Consul containers for updating configuration"
  block:
    - name: "SLM | CONSUL | Create compose definition from template"
      ansible.builtin.set_fact:
        consul_compose: "{{ lookup('template', 'consul.yml') }}"

    - name: "SLM | CONSUL | Start containers"
      community.docker.docker_compose_v2:
        project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
        definition: "{{ consul_compose | from_yaml}}"
        state: present
        pull: "{{ ENV.PULL_DOCKER_IMAGES }}"
