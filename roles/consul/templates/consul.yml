services:

  consul:
    image: "{{ ENV.CONSUL.IMAGE }}"
    restart: unless-stopped
    command: "consul agent -server -bootstrap-expect 1 -ui -bind=0.0.0.0 -client=0.0.0.0 -advertise {{ ENV.SLM_IP }} -data-dir=/consul/data -config-dir=/consul/config"
    logging:
      driver: "json-file"
      options:
        max-file: "{{ ENV.LOGGING_MAX_FILE }}"
        max-size: "{{ ENV.LOGGING_MAX_SIZE }}"
    environment:
      CONSUL_LOCAL_CONFIG: '{{ consul_local_config | to_json }}'
    networks:
      default:
        aliases:
          - "{{ ENV.CONSUL.HOST.INTERNAL }}"
    ports:
      - "{{ ENV.CONSUL.PORT.EXTERNAL }}:{{ ENV.CONSUL.PORT.INTERNAL }}"
      - "{{ ENV.CONSUL.PORT_RPC.EXTERNAL }}:{{ ENV.CONSUL.PORT_RPC.INTERNAL }}"
      - "{{ ENV.CONSUL.PORT_LAN_SERF.EXTERNAL }}:{{ ENV.CONSUL.PORT_LAN_SERF.INTERNAL }}"
    volumes:
      - consul_data:/consul/data
    extra_hosts:
      - "{{ ENV.SLM_HOSTNAME }}:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:{{ ENV.CONSUL.PORT.INTERNAL }}" ]

  consul-esm:
    image: "hashicorp/consul-esm:{{ ENV.CONSUL.ESM_VERSION }}"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "{{ ENV.LOGGING_MAX_FILE }}"
        max-size: "{{ ENV.LOGGING_MAX_SIZE }}"
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      CONSUL_HTTP_TOKEN: "{{ ENV.CONSUL.MASTER_TOKEN }}"
    extra_hosts:
      - "{{ ENV.SLM_HOSTNAME }}:host-gateway"

  consul-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:{{ ENV.CONSUL.OAUTH2_PROXY.VERSION | default('v7.15.5') }}   # pin a version
    restart: unless-stopped
    command: --ssl-insecure-skip-verify
    extra_hosts:
      - "{{ ENV.SLM_HOSTNAME }}:host-gateway"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://{{ ENV.SLM_HOSTNAME }}/auth/realms/fabos
      OAUTH2_PROXY_CLIENT_ID: "{{ consul_keycloak_client.client_id }}"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ consul_keycloak_client.client_secret | default('') }}"
      OAUTH2_PROXY_COOKIE_SECRET: "{{ consul_oauth2_proxy_cookie_secret }}"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: .{{ ENV.SLM_HOSTNAME }}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .{{ ENV.SLM_HOSTNAME }}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # no REDIRECT_URL: derived from the request host, so both hostnames work

volumes:
  consul_data: