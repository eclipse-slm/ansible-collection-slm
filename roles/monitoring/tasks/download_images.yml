---
### Optional Inputs:
# - eclipse_slm_monitoring_download_images_async (default: true)
# - eclipse_slm_monitoring_download_images_async_timeout (default: 3600)

# The compose template references the Consul token which is not needed to pull
# images; fill it with a placeholder if it is not defined yet.
- name: SLM | MONITORING | Generate Monitoring compose file
  ansible.builtin.set_fact:
    monitoring_compose: "{{ lookup('template', 'monitoring.yml', template_vars={'_consul_token': _consul_token | default('')}) }}"

- name: SLM | MONITORING | Download docker images asynchronously
  when: eclipse_slm_monitoring_download_images_async | default(true) | bool
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    policy: "{{ ENV.PULL_DOCKER_IMAGES }}"
    definition: "{{ monitoring_compose | from_yaml }}"
  async: "{{ eclipse_slm_monitoring_download_images_async_timeout | default(3600) }}"
  poll: 0
  register: eclipse_slm_monitoring_download_images_job

- name: SLM | MONITORING | Download docker images synchronously
  when: not (eclipse_slm_monitoring_download_images_async | default(true) | bool)
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    policy: "{{ ENV.PULL_DOCKER_IMAGES }}"
    definition: "{{ monitoring_compose | from_yaml }}"
