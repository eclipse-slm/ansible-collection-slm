---
roles:
  - name: molecule_generic
    src: https://github.com/eclipse-slm/molecule_generic.git
    scm: git
    version: main

  # Driver roles dispatched to by molecule_generic (names must match its driver map)
  - name: molecule_docker
    src: https://github.com/eclipse-slm/molecule_docker.git
    scm: git
    version: main

  - name: molecule_kubevirt
    src: https://github.com/eclipse-slm/molecule_kubevirt.git
    scm: git
    version: main

  - src: ipa-big.molecule_openstack
    version: 1.0.11
    name: molecule_openstack

  - src: "git+https://github.com/eclipse-slm/molecule_kubevirt"
    scm: git
    version: main
    name: eclipse-slm.molecule_kubevirt

  - name: ipa-big.molecule_openstack
    version: 1.0.11

  - src: "git+https://github.com/eclipse-slm/slm-ansible-role-docker"
    scm: git
    version: 1.0.8
    name: eclipse-slm.docker
