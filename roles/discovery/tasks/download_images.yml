---
### Optional Inputs:
# - eclipse_slm_discovery_download_images_async (default: true)
# - eclipse_slm_discovery_download_images_async_timeout (default: 3600)

- name: SLM | DISCOVERY | Generate Discovery compose file
  ansible.builtin.set_fact:
    discovery_compose: "{{ lookup('template', 'discovery.yml') }}"

- name: SLM | DISCOVERY | Download docker images asynchronously
  when: eclipse_slm_discovery_download_images_async | default(true) | bool
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    definition: "{{ discovery_compose | from_yaml }}"
  async: "{{ eclipse_slm_discovery_download_images_async_timeout | default(3600) }}"
  poll: 0
  register: eclipse_slm_discovery_download_images_job

- name: SLM | DISCOVERY | Download docker images synchronously
  when: not (eclipse_slm_discovery_download_images_async | default(true) | bool)
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    definition: "{{ discovery_compose | from_yaml }}"
