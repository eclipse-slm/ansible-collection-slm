---
### Optional Inputs:
# - eclipse_slm_consul_download_images_async (default: true)
# - eclipse_slm_consul_download_images_async_timeout (default: 3600)

- name: SLM | CONSUL | Generate Consul compose file
  ansible.builtin.set_fact:
    consul_compose: "{{ lookup('template', 'consul.yml') }}"

- name: SLM | CONSUL | Download docker images asynchronously
  when: eclipse_slm_consul_download_images_async | default(true) | bool
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    policy: "{{ ENV.PULL_DOCKER_IMAGES }}"
    definition: "{{ consul_compose | from_yaml }}"
  async: "{{ eclipse_slm_consul_download_images_async_timeout | default(3600) }}"
  poll: 0
  register: eclipse_slm_consul_download_images_job

- name: SLM | CONSUL | Download docker images synchronously
  when: not (eclipse_slm_consul_download_images_async | default(true) | bool)
  community.docker.docker_compose_v2_pull:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    policy: "{{ ENV.PULL_DOCKER_IMAGES }}"
    definition: "{{ consul_compose | from_yaml }}"
