---
- name: "SLM | Set compose definition for catalog"
  ansible.builtin.set_fact:
    catalog_compose: "{{ lookup('template', 'catalog.yml') }}"

- name: "SLM | Start containers"
  community.docker.docker_compose_v2:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    definition: "{{ catalog_compose | from_yaml }}"
    state: present
    pull: "{{ ENV.PULL_DOCKER_IMAGES }}"

- name: "SLM | Store resulting compose file"
  ansible.builtin.template:
    src: "catalog.yml"
    dest: "{{ _store_compose_dir | regex_replace('/+$', '') }}/slm.catalog.yml"
  when: (_store_compose_dir is defined) and (_store_compose_dir|length > 0)
