- name: "SLM | CONSUL | Assert inputs of 'consul | start.yml'"
  ansible.builtin.assert:
    that:
      - (ENV.CONSUL.SCHEME.INTERNAL is defined) and (ENV.CONSUL.SCHEME.INTERNAL|length > 0)
      - (ENV.CONSUL.HOST.INTERNAL is defined) and (ENV.CONSUL.HOST.INTERNAL|length > 0)
      - (ENV.CONSUL.PORT.INTERNAL is defined)

- name: "SLM | CONSUL | Make sure py-consul is installed"
  ansible.builtin.pip:
    name: py-consul
    state: present
    break_system_packages: true

- name: "SLM | CONSUL | Config"
  block:
    - name: "SLM | CONSUL | Check if instance is already running and get master token"
      ansible.builtin.include_tasks:
        file: "get_master_token.yml"

    - name: "SLM | CONSUL | Get master token of existing instance"
      when: consul_container.exists
      ansible.builtin.set_fact:
        ENV: "{{ ENV | combine({
                'CONSUL': {
                  'MASTER_TOKEN': consul_master_token
                }
              }, recursive=true) }}"

    - name: "SLM | CONSUL | Create master token"
      when: (ENV.CONSUL.MASTER_TOKEN is not defined) or (ENV.CONSUL.MASTER_TOKEN | default([]) | length == 0) and not consul_container.exists
      ansible.builtin.set_fact:
        ENV: "{{ ENV | combine({
                'CONSUL': {
                  'MASTER_TOKEN': lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'ascii_uppercase', 'digits'], length=24)
                }
              }, recursive=true) }}"

    - name: "SLM | CONSUL | Update consul_local_config dictionary and override default values"
      ansible.builtin.set_fact:
        consul_local_config: "{{ consul_local_config | default({}) | combine(
        { 'acl': {
            'tokens': {
              'master': ENV.CONSUL.MASTER_TOKEN
            }
          }
        }
        , recursive=true) }}"

- name: "SLM | CONSUL | Start"
  block:
    - name: "SLM | CONSUL | Display ENV.CONSUL"
      ansible.builtin.debug:
        var: ENV.CONSUL

    - name: "SLM | CONSUL | Create compose definition from template"
      ansible.builtin.set_fact:
        consul_compose: "{{ lookup('template', 'consul.yml') }}"

    - name: "SLM | CONSUL | Start containers"
      community.docker.docker_compose_v2:
        project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
        definition: "{{ consul_compose | from_yaml}}"
        state: present
        pull: "{{ ENV.PULL_DOCKER_IMAGES }}"

    - name: "SLM | CONSUL | Wait for Consul ('{{ consul.url.internal }}') being up"
      ansible.builtin.uri:
        url: "{{ consul.url.internal }}/v1/status/leader"
        return_content: true
        body_format: json
        status_code: 200
      register: result
      until: (result.json is defined) and (result.json|length > 0)
      retries: 120
      delay: 3

- name: "SLM | CONSUL | Store Consul local_config in Consul"
  community.general.consul_kv:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ ENV.CONSUL.MASTER_TOKEN }}"
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "config/consul/local_config", value: "{{ consul_local_config | to_yaml }}" }

- name: "SLM | CONSUL | Create Consul config dictionary and override default values"
  ansible.builtin.set_fact:
    consul_config: "{{ consul_config | default({}) | combine(
    { 'scheme': '{{ ENV.CONSUL.SCHEME.INTERNAL }}',
      'host': '{{ ENV.CONSUL.HOST.INTERNAL }}',
      'port': '{{ ENV.CONSUL.PORT.INTERNAL }}',
      'tokens': {
        'master': '{{ ENV.CONSUL.MASTER_TOKEN }}'
      }
    }
    , recursive=true) }}"

- name: "SLM | CONSUL | Store Consul config in Consul"
  community.general.consul_kv:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ ENV.CONSUL.MASTER_TOKEN }}"
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "config/consul/data", value: "{{ consul_config | to_yaml }}" }

- name: "SLM | CONSUL | Store resulting compose file"
  when: (_store_compose_dir is defined) and (_store_compose_dir|length > 0)
  ansible.builtin.template:
    src: "consul.yml"
    dest: "{{ _store_compose_dir | regex_replace('/+$', '') }}/consul.yml"

### Outputs
# CONSUL.MASTER_TOKEN    # Master token of the started Consul instance
